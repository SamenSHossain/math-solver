[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-quant"
version = "0.1.0"
description = "NBA game outcome, spread and total prediction: parquet data lake, coaching tendency scores, possession Monte Carlo, XGBoost win-probability dashboard"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "pyarrow>=15", "numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4",
  "xgboost>=2.0", "requests>=2.31", "duckdb>=0.10", "streamlit>=1.35", "plotly>=5.20",
]

[tool.setuptools.packages.find]
include = ["nba_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
